<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Curriculum Editor Browser Harness</title></head>
<body>
  <h1>Curriculum Editor Browser Harness</h1>
  <pre id="results">RUNNING</pre>
  <iframe id="editorFrame" title="Curriculum editor under test" width="1440" height="1200"></iframe>
  <script type="module">
    const assertions = [];
    const javascriptErrors = [];
    const check = (name, condition, detail = "") => assertions.push({ name, pass: Boolean(condition), detail: String(detail) });
    const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
    const report = async payload => {
      document.querySelector("#results").textContent = JSON.stringify(payload);
      document.body.dataset.complete = "true";
      document.title = `${payload.status} ${payload.passed}/${payload.total}`;
      await fetch("/__browser_test_result", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    };
    const until = async (callback, timeout = 10000) => {
      const started = Date.now();
      while (Date.now() - started < timeout) {
        const value = callback();
        if (value) return value;
        await wait(40);
      }
      throw new Error("Timed out waiting for browser condition.");
    };
    const worksheet = frame => frame.contentWindow.__curriculumEditor.getWorkspace();
    const worksheetDocument = frame => frame.contentWindow.__curriculumEditor.getWorksheetDocument();
    const visiblePages = frame => Array.from(worksheet(frame).querySelectorAll(".page")).filter(page => frame.contentWindow.getComputedStyle(page).display !== "none" && !page.hidden);
    const isNeutralRgb = color => {
      const value = color.trim();
      const shortHex = value.match(/^#([\da-f])([\da-f])([\da-f])$/i);
      const longHex = value.match(/^#([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i);
      const channels = shortHex
        ? shortHex.slice(1).map(channel => parseInt(channel + channel, 16))
        : longHex
          ? longHex.slice(1).map(channel => parseInt(channel, 16))
          : value.match(/[\d.]+/g)?.slice(0, 3).map(Number);
      return Boolean(channels?.length === 3 && channels[0] === channels[1] && channels[1] === channels[2]);
    };
    const rounded = value => Math.round(Number(value) * 100) / 100;
    const px = value => rounded(parseFloat(value));
    const near = (value, expected, tolerance = .03) => Math.abs(value - expected) <= tolerance;
    const dimensions = node => {
      const rect = node.getBoundingClientRect();
      return [rounded(rect.width), rounded(rect.height)];
    };
    const hasActualSaa = node => Boolean(node?.matches('img.saa-insignia[alt="Solar Agricultural Agency insignia"]') && /shared\/assets\/insignia\/saa\.svg(?:$|[%?#])/.test(node.getAttribute("src")) || node?.matches('svg.saa-insignia[role="img"][aria-label="Solar Agricultural Agency insignia"]') && node.querySelectorAll("path,circle").length >= 5);
    const layoutMetrics = frame => {
      const doc = frame.contentDocument;
      const toolbar = doc.querySelector(".toolbar").getBoundingClientRect();
      const layout = doc.querySelector(".editor-layout");
      const rail = doc.querySelector(".library-rail").getBoundingClientRect();
      const main = doc.querySelector(".editor-main").getBoundingClientRect();
      return {
        toolbarBottom: toolbar.bottom,
        toolbarHeight: toolbar.height,
        layoutPaddingTop: parseFloat(getComputedStyle(layout).paddingTop),
        railTop: rail.top,
        mainTop: main.top
      };
    };
    const worksheetGeometry = frame => {
      const page = visiblePages(frame)[0];
      const pageFrame = page.querySelector(".page-frame");
      const representative = page.querySelector(".task-heading,.mission-title-block,.continuation-header,.student-id") || pageFrame;
      const pageRect = page.getBoundingClientRect();
      const relativeRect = node => {
        const rect = node.getBoundingClientRect();
        return {
          left: rect.left - pageRect.left,
          top: rect.top - pageRect.top,
          width: rect.width,
          height: rect.height
        };
      };
      return {
        page: { width: pageRect.width, height: pageRect.height },
        pageFrame: relativeRect(pageFrame),
        representative: relativeRect(representative)
      };
    };
    const sameGeometry = (left, right, tolerance = .1) =>
      Object.keys(left).every(key => typeof left[key] === "number"
        ? Math.abs(left[key] - right[key]) <= tolerance
        : sameGeometry(left[key], right[key], tolerance));
    const setHtml = (frame, selector, html) => {
      const node = worksheet(frame).querySelector(selector);
      node.innerHTML = html;
      node.dispatchEvent(new frame.contentWindow.InputEvent("input", { bubbles: true }));
      return node;
    };
    async function loadEditor(cache = "first") {
      const frame = document.querySelector("#editorFrame");
      frame.src = `../index.html?browser-test=${cache}-${Date.now()}`;
      await until(() => frame.contentWindow?.__curriculumEditor);
      frame.contentWindow.addEventListener("error", event => javascriptErrors.push(String(event.error?.stack || event.message || "window error")));
      frame.contentWindow.addEventListener("unhandledrejection", event => javascriptErrors.push(String(event.reason?.stack || event.reason || "unhandled rejection")));
      await wait(180);
      return frame;
    }
    async function loadExport(html) {
      const frame = document.createElement("iframe");
      frame.title = "Portable export test";
      frame.width = "1440";
      frame.height = "1200";
      frame.sandbox = "allow-scripts allow-same-origin";
      frame.srcdoc = html;
      document.body.append(frame);
      await until(() => frame.contentWindow?.__curriculumPortable);
      frame.contentWindow.addEventListener("error", event => javascriptErrors.push(String(event.error?.stack || event.message || "portable window error")));
      frame.contentWindow.addEventListener("unhandledrejection", event => javascriptErrors.push(String(event.reason?.stack || event.reason || "portable unhandled rejection")));
      await wait(100);
      return frame;
    }
    try {
      localStorage.clear();
      let frame = await loadEditor();
      let win = frame.contentWindow;
      let doc = frame.contentDocument;
      let api = win.__curriculumEditor;
      let workspace = api.getWorkspace();
      let worksheetDoc = api.getWorksheetDocument();
      check("central app exposes its runtime API", Boolean(api));
      check("registry-loaded Case 03 package is current approved stable with owner PASS", api.getPackage().id === "SSS-C1-CASE03" && api.getPackage().schemaVersion === 2 && api.getPackage().version === "1.1" && api.getPackage().status === "APPROVED_STABLE" && api.getPackage().approval?.date === "2026-07-31" && api.getPackage().approval?.owner === "Nate / Owner" && api.getPackage().approval?.status === "APPROVED" && api.getPackage().approval?.printStatus === "PASS");
      check("approved master is not used as package content", !api.getPackage().content.source.includes("master/"));
      check("worksheet presentation is isolated in open Shadow DOM", doc.querySelector("#worksheetHost").shadowRoot && workspace.getRootNode() === doc.querySelector("#worksheetHost").shadowRoot);
      check("isolated worksheet retains a labelled main landmark", workspace.tagName === "MAIN" && workspace.getAttribute("aria-label")?.includes("Mars Habitat"));
      check("load status announces the case", doc.querySelector("#loadStatus").textContent.includes("Mars Habitat"));
      const railRoles = Array.from(doc.querySelectorAll('input[name="libraryRole"]')).map(node => node.value);
      check("library rail exposes only four instructional roles", JSON.stringify(railRoles) === JSON.stringify(["student", "teacher", "answer", "accessible"]), railRoles.join(","));
      check("library rail has no Grayscale role option", !doc.querySelector('input[name="libraryRole"][value="grayscale"]'));

      const expectedOrder = ["fillControl", "editControl", "marginTop", "marginRight", "marginBottom", "marginLeft", "marginReset", "densityControl", "grayControl", "guideControl", "boundaryControl", "printButton", "downloadButton", "downloadRoleButton", "clearButton", "resetButton", "stateStatus", "overflowStatus"];
      const actualOrder = Array.from(doc.querySelectorAll(".toolbar input[id],.toolbar select[id],.toolbar button[id],.toolbar #stateStatus,.toolbar #overflowStatus")).map(node => node.id);
      check("all required controls exist exactly once in contract order", JSON.stringify(actualOrder) === JSON.stringify(expectedOrder), actualOrder.join(","));
      const actionIds = ["printButton", "downloadButton", "downloadRoleButton", "clearButton", "resetButton"];
      const actionLabels = ["Print / Save PDF", "Download Editable Copy", "Download Worksheet", "Clear Responses", "Reset This Case"];
      const actionButtons = actionIds.map(id => doc.querySelector(`#${id}`));
      check("toolbar action order and exact visible labels match owner approval", JSON.stringify(actionButtons.map(node => node.textContent.trim())) === JSON.stringify(actionLabels));
      check("toolbar keyboard order matches visual action order", JSON.stringify(Array.from(doc.querySelectorAll(".toolbar-group button")).slice(-5).map(node => node.id)) === JSON.stringify(actionIds));
      check("toolbar accessible names match visible action labels", actionButtons.every((node, index) => !node.hasAttribute("aria-label") && node.textContent.trim() === actionLabels[index]));
      check("old toolbar action labels are absent", ["Download Current HTML", "Download Current Role", "Clear Current Role", "Reset Source"].every(label => !doc.querySelector(".toolbar").innerText.includes(label)));
      check("download actions have exact accessible descriptions", doc.querySelector("#downloadButton").getAttribute("aria-describedby") === "downloadEditableDescription" && doc.querySelector("#downloadEditableDescription").textContent.trim() === "Downloads all roles with the editing toolbar and current changes." && doc.querySelector("#downloadRoleButton").getAttribute("aria-describedby") === "downloadWorksheetDescription" && doc.querySelector("#downloadWorksheetDescription").textContent.trim() === "Downloads only the selected role as a clean HTML worksheet without editing controls.");
      check("central toolbar has no duplicate Role selector", !doc.querySelector(".toolbar #roleControl"));
      check("central toolbar retains the Grayscale presentation toggle", Boolean(doc.querySelector('.toolbar #grayControl[aria-label="Grayscale presentation"]')));
      check("removed Role selector leaves no empty toolbar group", Array.from(doc.querySelectorAll(".toolbar-group")).every(group => group.querySelector("input,select,button")));
      check("toolbar is owned outside case content", !workspace.querySelector(".toolbar"));
      check("toolbar save status is polite live text", doc.querySelector("#stateStatus").getAttribute("aria-live") === "polite");
      check("toolbar page-fit status is polite live text", doc.querySelector("#overflowStatus").getAttribute("aria-live") === "polite");
      check("page-fit description explains printable-area fullness", doc.querySelector("#pageFitDescription").textContent.trim() === "A page is too full when content extends beyond its printable page area." && doc.querySelector("#overflowStatus").getAttribute("aria-describedby") === "pageFitDescription");
      const boundaryControl = doc.querySelector("#boundaryControl");
      check("toolbar label is exactly Page shadow and old Boundaries label is absent", boundaryControl.closest("label").textContent.trim() === "Page shadow" && !doc.querySelector(".toolbar").innerText.includes("Boundaries"));
      check("Page shadow has its exact accessible description", boundaryControl.getAttribute("aria-describedby") === "pageShadowDescription" && doc.querySelector("#pageShadowDescription").textContent.trim() === "Adds a screen-only shadow around each worksheet page for visual separation.");
      check("Page shadow is enabled by default", boundaryControl.checked && api.getState().boundaries === true);

      for (const width of [1440, 1100, 820, 640]) {
        frame.width = String(width);
        await wait(180);
        api.syncToolbarOffset();
        await wait(40);
        const metrics = layoutMetrics(frame);
        const railGap = Math.abs(metrics.railTop - metrics.toolbarBottom);
        const paddingGap = Math.abs(metrics.layoutPaddingTop - metrics.toolbarHeight);
        const mainGap = width > 700 ? Math.abs(metrics.mainTop - metrics.toolbarBottom) : 0;
        check(`${width}px layout begins directly below measured toolbar`, railGap <= 1.5 && paddingGap <= 1.5 && mainGap <= 1.5, JSON.stringify({ railGap, paddingGap, mainGap, metrics }));
        if (width >= 1100) check(`${width}px action labels fit without internal wrapping`, actionButtons.every(button => win.getComputedStyle(button).whiteSpace === "nowrap" && button.scrollWidth <= button.clientWidth + 1 && button.scrollHeight <= button.clientHeight + 1));
      }
      frame.width = "1440";
      await wait(180);
      api.syncToolbarOffset();

      const geometryRoles = ["student", "teacher", "answer", "accessible"];
      const wideGeometry = {};
      for (const role of geometryRoles) {
        api.setRole(role);
        await wait(40);
        wideGeometry[role] = worksheetGeometry(frame);
      }
      const wideViewport = { width: frame.clientWidth, workspace: workspace.clientWidth, geometry: wideGeometry };
      frame.width = "640";
      await wait(180);
      api.syncToolbarOffset();
      const narrowGeometry = {};
      for (const role of geometryRoles) {
        api.setRole(role);
        await wait(40);
        narrowGeometry[role] = worksheetGeometry(frame);
      }
      const narrowPage = visiblePages(frame)[0];
      const narrowWorkspaceRect = workspace.getBoundingClientRect();
      const leftEdgeAtStart = (() => {
        workspace.scrollLeft = 0;
        return narrowPage.getBoundingClientRect().left >= narrowWorkspaceRect.left - 1;
      })();
      const rightEdgeAtEnd = (() => {
        workspace.scrollLeft = workspace.scrollWidth - workspace.clientWidth;
        return narrowPage.getBoundingClientRect().right <= narrowWorkspaceRect.right + 1;
      })();
      check("worksheet page and internal geometry are identical at 1440px and 640px in every role", geometryRoles.every(role => sameGeometry(wideGeometry[role], narrowGeometry[role])), JSON.stringify({ wideGeometry, narrowGeometry }));
      check("narrow worksheet workspace scrolls horizontally without document-level overflow", workspace.scrollWidth > workspace.clientWidth && doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1, JSON.stringify({ workspace: [workspace.clientWidth, workspace.scrollWidth], document: [doc.documentElement.clientWidth, doc.documentElement.scrollWidth] }));
      check("horizontal worksheet scrolling exposes both page edges", leftEdgeAtStart && rightEdgeAtEnd, JSON.stringify({ leftEdgeAtStart, rightEdgeAtEnd, maxScrollLeft: workspace.scrollWidth - workspace.clientWidth }));
      check("editor-only fixed-page rules stay screen-scoped and out of exports and print", worksheetDoc.getRootNode().querySelector('style[data-editor-workspace-layout="fixed-page-geometry"]')?.textContent.includes("@media screen") && !api.serializePortableHTML().includes("fixed-page-geometry") && !api.serializeRoleHTML("accessible").includes("fixed-page-geometry") && !api.buildPrintDocument("accessible").includes("fixed-page-geometry"));
      check("canonical Letter page dimensions remain 816 by 1056 CSS pixels", geometryRoles.every(role => Math.abs(wideGeometry[role].page.width - 816) <= .1 && Math.abs(wideGeometry[role].page.height - 1056) <= .1), JSON.stringify({ wideViewport, narrowViewport: { width: frame.clientWidth, workspace: workspace.clientWidth } }));
      check("canonical page frames remain 720 by 960 CSS pixels with 48-pixel insets", geometryRoles.every(role => [wideGeometry[role], narrowGeometry[role]].every(geometry => Math.abs(geometry.pageFrame.width - 720) <= .1 && Math.abs(geometry.pageFrame.height - 960) <= .1 && Math.abs(geometry.pageFrame.left - 48) <= .1 && Math.abs(geometry.pageFrame.top - 48) <= .1)), JSON.stringify({ wideGeometry, narrowGeometry }));
      workspace.scrollLeft = 0;
      frame.width = "1440";
      await wait(180);
      api.syncToolbarOffset();
      api.setRole("student");

      const fitFrames = visiblePages(frame).slice(0, 2).map(page => page.querySelector(".page-frame"));
      const fitFrameStyles = fitFrames.map(node => node.getAttribute("style"));
      fitFrames[0].style.height = "1px";
      check("one affected page uses 1 page too full in both statuses", api.checkOverflow() === 1 && doc.querySelector("#overflowStatus").textContent === "1 page too full" && doc.querySelector("#overflowStatusMirror").textContent === "1 page too full" && doc.querySelector("#overflowStatus").classList.contains("toolbar-overflow") && doc.querySelector("#overflowStatusMirror").classList.contains("page-fit-warning"));
      fitFrames[1].style.height = "1px";
      check("multiple affected pages use N pages too full in both statuses", api.checkOverflow() === 2 && doc.querySelector("#overflowStatus").textContent === "2 pages too full" && doc.querySelector("#overflowStatusMirror").textContent === "2 pages too full");
      fitFrames.forEach((node, index) => fitFrameStyles[index] === null ? node.removeAttribute("style") : node.setAttribute("style", fitFrameStyles[index]));
      check("restored pages use Pages fit without warning treatment", api.checkOverflow() === 0 && doc.querySelector("#overflowStatus").textContent === "Pages fit" && doc.querySelector("#overflowStatusMirror").textContent === "Pages fit" && !doc.querySelector("#overflowStatus").classList.contains("toolbar-overflow") && !doc.querySelector("#overflowStatusMirror").classList.contains("page-fit-warning"));

      const shadowPage = visiblePages(frame)[0];
      const shadowFrame = shadowPage.querySelector(".page-frame");
      const pageRectBefore = shadowPage.getBoundingClientRect();
      const frameRectBefore = shadowFrame.getBoundingClientRect();
      const shadowBefore = win.getComputedStyle(shadowPage).boxShadow;
      boundaryControl.click();
      const pageRectWithoutShadow = shadowPage.getBoundingClientRect();
      const frameRectWithoutShadow = shadowFrame.getBoundingClientRect();
      check("Page shadow toggle changes only the page box shadow", shadowBefore !== "none" && win.getComputedStyle(shadowPage).boxShadow === "none");
      check("Page shadow toggle does not change page or page-frame geometry", Math.abs(pageRectBefore.width - pageRectWithoutShadow.width) < .01 && Math.abs(pageRectBefore.height - pageRectWithoutShadow.height) < .01 && Math.abs(frameRectBefore.width - frameRectWithoutShadow.width) < .01 && Math.abs(frameRectBefore.height - frameRectWithoutShadow.height) < .01);
      boundaryControl.click();
      check("Page shadow can be restored without changing page fit", api.getState().boundaries === true && win.getComputedStyle(shadowPage).boxShadow === shadowBefore && api.checkOverflow() === 0);

      const expectedCounts = { student: 4, teacher: 8, answer: 4, accessible: 7 };
      for (const [role, expected] of Object.entries(expectedCounts)) {
        api.setRole(role);
        await wait(80);
        check(`${role} role loads ${expected} pages`, visiblePages(frame).length === expected, visiblePages(frame).length);
        check(`${role} role reports Pages fit`, api.checkOverflow() === 0 && doc.querySelector("#overflowStatus").textContent === "Pages fit" && doc.querySelector("#overflowStatusMirror").textContent === "Pages fit", doc.querySelector("#overflowStatus").textContent);
        check(`${role} role contains no other role pages`, visiblePages(frame).every(page => page.dataset.role === role));
      }

      api.setRole("student");
      check("non-selected worksheet roles leave the accessibility tree", Array.from(workspace.querySelectorAll('.page:not([data-role="student"])')).every(page => page.hidden && page.getAttribute("aria-hidden") === "true") && Array.from(workspace.querySelectorAll('.page[data-role="student"]')).every(page => !page.hidden && page.getAttribute("aria-hidden") === "false"));
      const grayControl = doc.querySelector("#grayControl");
      grayControl.checked = true;
      grayControl.dispatchEvent(new win.Event("change", { bubbles: true }));
      check("Student plus Grayscale retains Student as selected role", api.getState().role === "student" && api.getState().grayscale === true);
      check("Student plus Grayscale renders four Student pages", visiblePages(frame).length === 4 && visiblePages(frame).every(page => page.dataset.role === "student"));
      check("Student plus Grayscale keeps the normal Student output identity", api.getCurrentRoleOutput().outputRole === "student" && api.getCurrentRoleOutput().filename.includes("STUDENT_MISSION") && !api.getCurrentRoleOutput().filename.includes("GRAYSCALE"));
      check("Grayscale uses token presentation rather than a role switch", doc.body.classList.contains("grayscale") && doc.body.dataset.role === "student" && worksheetDoc.classList.contains("grayscale") && worksheetDoc.dataset.role === "student");
      doc.querySelector('input[name="libraryRole"][value="teacher"]').click();
      await wait(60);
      check("left rail is authoritative for role switching", api.getState().role === "teacher" && visiblePages(frame).length === 8);
      check("switching roles preserves Grayscale mode", api.getState().grayscale === true && doc.body.classList.contains("grayscale"));
      check("Teacher with Grayscale retains its document-role output", api.getCurrentRoleOutput().outputRole === "teacher" && api.getCurrentRoleOutput().filename.includes("TEACHER_GUIDE"));
      check("role and Grayscale status are announced", doc.querySelector("#loadStatus").textContent.includes("Teacher selected") && doc.querySelector("#loadStatus").textContent.includes("Grayscale on"));
      grayControl.checked = false;
      grayControl.dispatchEvent(new win.Event("change", { bubbles: true }));
      check("turning Grayscale off does not change selected role", api.getState().role === "teacher" && api.getState().grayscale === false);

      api.resetSource(true);
      await wait(50);
      const instructionSelector = '[data-persist-id="student-mission-01-instruction-001"]';
      const responseSelector = '[data-persist-id="t1"]';
      const accessibleSelector = '[data-persist-id="a1a"]';
      const instruction = workspace.querySelector(instructionSelector);
      const response = workspace.querySelector(responseSelector);
      const originalInstruction = instruction.innerHTML;
      check("Fill Responses leaves instructional text locked", instruction.contentEditable === "false");
      check("Fill Responses enables selected-role response fields", response.contentEditable === "true");
      response.focus();
      check("keyboard focus enters the isolated worksheet response", workspace.getRootNode().activeElement === response && response.tabIndex === 0);
      api.saveState({ editMode: true });
      check("Edit Text enables marked instructional nodes", instruction.contentEditable === "true");
      check("Edit Text leaves responses editable", response.contentEditable === "true");
      check("Edit Text mode is visibly indicated", doc.body.classList.contains("edit-mode") && doc.querySelector("#modeIndicator").textContent.includes("Edit Text mode"));

      api.saveState({ marginTop: .3, marginRight: .4, marginBottom: .6, marginLeft: .7 });
      check("four margins update independently", [api.getState().marginTop, api.getState().marginRight, api.getState().marginBottom, api.getState().marginLeft].join("|") === "0.3|0.4|0.6|0.7");
      doc.querySelector("#marginReset").click();
      check("Reset Margins restores all four defaults", ["Top", "Right", "Bottom", "Left"].every(side => api.getState()[`margin${side}`] === .5));
      api.saveState({ density: "compact", grayscale: true, guides: true, boundaries: false });
      check("Density applies through the central state path", doc.body.classList.contains("density-compact"));
      check("Grayscale applies through token mode", doc.body.classList.contains("grayscale"));
      check("Guides and Page shadow apply through central state", doc.body.classList.contains("show-guides") && doc.body.classList.contains("hide-boundaries"));
      win.dispatchEvent(new Event("beforeprint"));
      check("print-preview reflects selected role and Grayscale state", doc.body.classList.contains("print-preview") && doc.body.dataset.role === "student" && doc.body.classList.contains("grayscale"));
      win.dispatchEvent(new Event("afterprint"));
      check("print-preview state clears after print", !doc.body.classList.contains("print-preview"));

      api.resetSource(true);
      api.saveState({ editMode: true });
      setHtml(frame, instructionSelector, "BROWSER TEST · edited instructional sentence");
      setHtml(frame, responseSelector, "BROWSER TEST · student response");
      api.setRole("accessible");
      setHtml(frame, accessibleSelector, "BROWSER TEST · accessible response");
      api.setRole("student");
      const originalConfirm = win.confirm;
      let confirmationMessage = "";
      win.confirm = message => { confirmationMessage = message; return false; };
      check("Clear Responses requires explicit confirmation and cancellation preserves work", api.clearCurrentRole(false) === false && workspace.querySelector(responseSelector).textContent.includes("student response"));
      check("Clear Responses uses the exact confirmation dialog", confirmationMessage === "Clear all responses in the current role?");
      win.confirm = message => { confirmationMessage = message; return true; };
      api.clearCurrentRole(false);
      check("Clear Responses clears selected-role responses", workspace.querySelector(responseSelector).textContent === "");
      check("Clear Responses preserves instructional edits", workspace.querySelector(instructionSelector).textContent.includes("edited instructional"));
      check("Clear Responses preserves another role's work", workspace.querySelector(accessibleSelector).textContent.includes("accessible response"));
      const otherCaseStateKey = "curriculum-editor:SSS-C1-CASE02:v1.0:curriculum-editor-v2:state";
      const unrelatedStorageKey = "curriculum-editor-browser-test:unrelated";
      win.localStorage.setItem(otherCaseStateKey, "OTHER CASE STATE");
      win.localStorage.setItem(unrelatedStorageKey, "UNRELATED STATE");
      const selectedCaseBeforeReset = win.localStorage.getItem("curriculum-editor:selected-case:v1");
      win.confirm = message => { confirmationMessage = message; return false; };
      check("Reset This Case requires explicit confirmation and cancellation preserves work", api.resetSource(false) === false && workspace.querySelector(instructionSelector).textContent.includes("edited instructional") && workspace.querySelector(accessibleSelector).textContent.includes("accessible response"));
      check("Reset This Case uses the exact two-paragraph confirmation dialog", confirmationMessage === "Reset this case to its approved defaults?\n\nThis will remove all locally saved responses, instructional edits, and display settings for this case.");
      win.confirm = message => { confirmationMessage = message; return true; };
      api.resetSource(false);
      check("Reset This Case restores package instructional source", workspace.querySelector(instructionSelector).innerHTML === originalInstruction);
      check("Reset This Case clears package response work", workspace.querySelector(accessibleSelector).textContent === "");
      check("Reset This Case restores all default controls", api.getState().role === "student" && api.getState().density === "normal" && api.getState().fillMode === true && api.getState().editMode === false && api.getState().grayscale === false && api.getState().guides === false && api.getState().boundaries === true);
      check("Reset This Case removes only current case/version recovery keys", win.localStorage.getItem(api.keys.stateKey) === null && win.localStorage.getItem(api.keys.contentKey) === null && win.localStorage.getItem(otherCaseStateKey) === "OTHER CASE STATE" && win.localStorage.getItem(unrelatedStorageKey) === "UNRELATED STATE" && win.localStorage.getItem("curriculum-editor:selected-case:v1") === selectedCaseBeforeReset);
      win.localStorage.removeItem(otherCaseStateKey);
      win.localStorage.removeItem(unrelatedStorageKey);
      win.confirm = originalConfirm;

      api.saveState({ editMode: true });
      setHtml(frame, instructionSelector, "BROWSER TEST · persisted instructional edit");
      setHtml(frame, responseSelector, "BROWSER TEST · persisted response");
      frame = await loadEditor("reload");
      win = frame.contentWindow;
      doc = frame.contentDocument;
      api = win.__curriculumEditor;
      workspace = api.getWorkspace();
      worksheetDoc = api.getWorksheetDocument();
      check("autosave survives a full application reload", workspace.querySelector(responseSelector).textContent.includes("persisted response") && workspace.querySelector(instructionSelector).textContent.includes("persisted instructional"));
      check("selected role survives reload", api.getState().role === "student");
      check("reload reports restored autosave", doc.querySelector("#stateStatus").textContent === "AUTOSAVE RESTORED");

      api.saveState({ grayscale: true });
      const portable = api.serializePortableHTML();
      check("complete serializer emits a complete HTML document", portable.toLowerCase().startsWith("<!doctype html>"));
      check("complete serializer embeds instructional edits", portable.includes("persisted instructional edit"));
      check("complete serializer embeds response edits", portable.includes("persisted response"));

          check(`${item.id} ${profile.name} worksheet export preserves its role and normal filename`, (() => { const output = api.getCurrentRoleOutput(); const exported = new DOMParser().parseFromString(api.serializeRoleHTML(profile.role), "text/html"); return output.outputRole === profile.role && !output.filename.includes("GRAYSCALE") && exported.body.dataset.role === profile.role && exported.body.classList.contains("grayscale") === profile.grayscale && exported.querySelectorAll(`.page[data-role="${profile.role}"]`).length === profile.expected && !exported.querySelector(`.page:not([data-role="${profile.role}"])`); })());
          matrixStates.push({ caseId: item.id, role: profile.role, grayscale: profile.grayscale, pass: assertions.slice(matrixStart).every(assertion => assertion.pass) });
        }
        api.setRole("student");
        api.saveState({ grayscale: false });
        const parentPrint = win.print;
        let parentPrintCalls = 0;
        win.print = () => { parentPrintCalls += 1; };
        const isolatedFrame = await api.printCurrentRole({ invokePrint: false, confirmOnTooFull: false });
        const isolatedDoc = isolatedFrame.contentDocument;
        const isolatedPages = Array.from(isolatedDoc.querySelectorAll("#workspace > .page"));
        check(`${item.id} print path creates a temporary same-origin isolated role iframe without parent print`, isolatedFrame.parentNode === doc.body && isolatedFrame.classList.contains("curriculum-print-frame") && Boolean(isolatedDoc) && parentPrintCalls === 0);
        check(`${item.id} loaded print iframe excludes chrome and physically contains only selected pages`, !isolatedDoc.querySelector(".toolbar,#editorToolbarHost,.library-rail,.workspace-header,.editor-statuses,.skip-link,#portableConfig,script") && isolatedPages.length === item.counts.student && isolatedDoc.querySelectorAll('.page:not([data-role="student"])').length === 0);
        check(`${item.id} loaded print iframe preserves current response and instructional edits`, isolatedDoc.querySelector(`[data-persist-id="${response.dataset.persistId}"]`)?.textContent === caseMarkers[item.id].responseText && isolatedDoc.querySelector(`[data-persist-id="${editable.dataset.persistId}"]`)?.textContent === caseMarkers[item.id].editText);
        const livePageRect = visiblePages(frame)[0].getBoundingClientRect();
        const printPageRect = isolatedPages[0].getBoundingClientRect();
        check(`${item.id} loaded print iframe preserves worksheet geometry and removes Page shadow`, Math.abs(livePageRect.width - printPageRect.width) < .1 && Math.abs(livePageRect.height - printPageRect.height) < .1 && isolatedFrame.contentWindow.getComputedStyle(isolatedPages[0]).boxShadow === "none");
        const printMeta = Boolean(isolatedDoc.querySelector('meta[name="sss-export-kind"][content="isolated-role-print"]'));
        const printAtPage = isolatedDoc.querySelector("style")?.textContent.includes("@page");
        const printAuthoringState = isolatedDoc.querySelector('[contenteditable="true"],.page.has-overflow');
        check(`${item.id} print document embeds print CSS/assets and has no authoring state`, printMeta && printAtPage && !printAuthoringState, JSON.stringify({ printMeta, printAtPage, printAuthoringState: printAuthoringState?.outerHTML.slice(0, 160) || null }));
        isolatedFrame.remove();
        if (item.id === "SSS-C1-CASE03") {
          let isolatedWindowPrintCalls = 0;
          const printFrameObserved = new Promise(resolve => {
            const observer = new MutationObserver(records => {
              const added = records.flatMap(record => Array.from(record.addedNodes)).find(node => node.nodeType === Node.ELEMENT_NODE && node.classList.contains("curriculum-print-frame"));
              if (!added) return;
              observer.disconnect();
              added.addEventListener("load", () => {
                added.contentWindow.print = () => {
                  isolatedWindowPrintCalls += 1;
                  added.contentWindow.dispatchEvent(new added.contentWindow.Event("afterprint"));
                };
                resolve(added);
              }, { once: true });
            });
            observer.observe(doc.body, { childList: true });
          });
          const actualPrint = api.printCurrentRole({ confirmOnTooFull: false, cleanupFallbackMs: 100 });
          const actualPrintFrame = await printFrameObserved;
          await actualPrint;
          await wait(20);
          check("Print / Save PDF calls only the isolated role window and removes its temporary iframe after afterprint", parentPrintCalls === 0 && isolatedWindowPrintCalls === 1 && !actualPrintFrame.isConnected);
        }
        win.print = parentPrint;
        if (item.id === "SSS-C1-CASE04") {
          const lockedTitles = ["Initial Thinking — Identify the Variable", "Build the Change-to-Crash Timeline", "Isolate Variables and Test Alternatives", "Diagnose the Reactor Failure", "Model the Repeating Crash Cycle", "Explain the Failure with CER", "Design Independent Reactor Controls", "Exit Ticket — Cause or Effect?"];
          const roleTitles = role => Array.from(workspace.querySelectorAll(`.page[data-role="${role}"] .task-heading`)).map(node => node.dataset.taskTitle);
          check("Case 04 generated Student, Answer Key, and Accessible task titles have exact parity", ["student", "answer", "accessible"].every(role => JSON.stringify(roleTitles(role)) === JSON.stringify(lockedTitles)));
          check("Case 04 has one atomic CER in each required learner role", ["student-v1.0", "answer-v1.0", "accessible-v1.0"].every(contract => { const root = workspace.querySelector(`[data-cer-contract="${contract}"]`); return root && Array.from(root.querySelectorAll("*")).every(child => child.closest(".page") === root.closest(".page")); }));
          check("Case 04 timeline and process models remain atomic", Array.from(workspace.querySelectorAll("[data-timeline-contract],[data-process-contract]")).every(root => Array.from(root.querySelectorAll("*")).every(child => child.closest(".page") === root.closest(".page"))));
          check("Case 04 Accessible pages retain ordered reading structure", JSON.stringify(Array.from(workspace.querySelectorAll('.page[data-role="accessible"]')).map(page => page.dataset.pageId)) === JSON.stringify(["accessible-mission-01", "accessible-mission-02", "accessible-mission-03", "accessible-mission-04", "accessible-mission-05", "accessible-mission-06"]));
          const studentDistribution = Array.from(workspace.querySelectorAll('.page[data-role="student"]')).map(page => Array.from(page.querySelectorAll(".task-heading")).map(node => Number(node.dataset.taskId)));
          check("Case 04 Student page 1 contains complete Tasks 1 and 2 with Task 3 held intact for page 2", JSON.stringify(studentDistribution[0]) === JSON.stringify([1, 2]) && studentDistribution[1][0] === 3 && workspace.querySelector('.page[data-page-id="student-mission-01"] .task-block .task-heading[data-task-id="2"]'));
          const pageReserves = Array.from(workspace.querySelectorAll('.page[data-role="student"]')).map(page => { const content = page.querySelector(".content-area"); const last = content.lastElementChild; return { page: page.dataset.pageId, pixels: rounded(content.getBoundingClientRect().bottom - last.getBoundingClientRect().bottom) }; });
          check("Case 04 Student pages retain intentional bottom reserve without overflow", pageReserves.every(item => item.pixels >= 0), JSON.stringify(pageReserves));

          const cerGeometry = {};
          for (const [role, contract] of [["student", "student-v1.0"], ["answer", "answer-v1.0"], ["accessible", "accessible-v1.0"]]) {
            api.setRole(role);
            await wait(20);
            const root = workspace.querySelector(`[data-cer-contract="${contract}"]`);
            const boxes = Array.from(root.querySelectorAll(":scope > .canonical-cer-box"));
            const rootStyle = win.getComputedStyle(root);
            const firstBoxStyle = win.getComputedStyle(boxes[0]);
            cerGeometry[role] = { contract, root: dimensions(root), minHeight: px(rootStyle.minHeight), boxHeights: boxes.map(box => dimensions(box)[1]), columns: firstBoxStyle.gridTemplateColumns, gap: px(firstBoxStyle.columnGap), label: dimensions(boxes[0].querySelector(".canonical-cer-label")), response: dimensions(boxes[0].querySelector(".canonical-cer-response,.answer-block")) };
          }
          const studentCer = cerGeometry.student;
          const answerCer = cerGeometry.answer;
          const accessibleCer = cerGeometry.accessible;
          check("Case 04 canonical CER computed geometry matches shared Student, Answer, and Accessible contracts", near(studentCer.minHeight, 244.8) && near(studentCer.root[1], 244.8) && near(parseFloat(studentCer.columns), 69.12) && answerCer.boxHeights[0] >= 44.13 && answerCer.boxHeights[1] >= 63.33 && answerCer.boxHeights[2] >= 72.93 && accessibleCer.boxHeights[0] >= 74.85 && accessibleCer.boxHeights[1] >= 113.25 && accessibleCer.boxHeights[2] >= 113.25 && near(parseFloat(accessibleCer.columns), 91.2), JSON.stringify(cerGeometry));
          api.setRole("student");
          await wait(20);
          check("Case 04 Student Task 2 timeline response boxes retain the approved page-one height", Array.from(workspace.querySelectorAll('.page[data-page-id="student-mission-01"] .timeline-response')).every(node => dimensions(node)[1] >= 76.77));
          check("Case 04 Student Task 3 evidence-analysis boxes provide expanded writing area", Array.from(workspace.querySelectorAll('.page[data-page-id="student-mission-02"] .evidence-table .table-response')).every(node => { const [width, height] = dimensions(node); return width >= 310 && height >= 71.97; }));
          check("Case 04 Student Task 5 cycle response boxes fit mechanism-bank phrases", Array.from(workspace.querySelectorAll('.page[data-page-id="student-mission-03"] .stage-response')).every(node => { const [width, height] = dimensions(node); return width >= 200 && height >= 115.17; }));
          check("Case 04 Student Task 5 follows the two-row snake sequence", (() => {
            const model = workspace.querySelector('.page[data-page-id="student-mission-03"] .cycle-model');
            const stages = Object.fromEntries(Array.from(model.querySelectorAll('[data-process-stage]')).map(node => [node.dataset.processStage, node.getBoundingClientRect()]));
            const arrows = Array.from(model.querySelectorAll('[data-process-connector]')).map(node => node.textContent.trim());
            return JSON.stringify(arrows) === JSON.stringify(["→", "→", "↓", "←", "←"])
              && near(stages["1"].top, stages["2"].top) && near(stages["2"].top, stages["3"].top)
              && stages["1"].left < stages["2"].left && stages["2"].left < stages["3"].left
              && near(stages["4"].top, stages["5"].top) && near(stages["5"].top, stages["6"].top)
              && stages["4"].left > stages["5"].left && stages["5"].left > stages["6"].left
              && stages["4"].top > stages["3"].bottom;
          })());
          check("Case 04 Student Task 7 distinguishes the two control responses", (() => {
            const page = workspace.querySelector('.page[data-page-id="student-mission-04"]');
            const labels = Array.from(page.querySelectorAll('.task-heading[data-task-id="7"] ~ .two-col .response-label')).map(node => node.textContent.trim());
            const directions = page.querySelector('.task-heading[data-task-id="7"] ~ .directions')?.textContent || "";
            return JSON.stringify(labels) === JSON.stringify(["Immediate recovery action", "Long-term independent control"]) && directions.includes("validated recovery schedule") && directions.includes("independently of corridor lighting");
          })());
          const studentTaskGaps = [
            ["student-mission-01", "1", "2"],
            ["student-mission-02", "3", "4"],
            ["student-mission-04", "7", "8"]
          ].map(([pageId, previousId, nextId]) => {
            const page = workspace.querySelector(`.page[data-page-id="${pageId}"]`);
            const next = page.querySelector(`.task-heading[data-task-id="${nextId}"]`);
            const taskStart = next.closest(".task-block") || next;
            const previousEnd = taskStart.previousElementSibling;
            const priorHeading = page.querySelector(`.task-heading[data-task-id="${previousId}"]`);
            const gap = next.getBoundingClientRect().top - previousEnd.getBoundingClientRect().bottom;
            return { pair: `${previousId}-${nextId}`, gap: rounded(gap), pass: Boolean(priorHeading && previousEnd && gap >= 17.2) };
          });
          check("Case 04 Student task pairs preserve standard inter-task spacing", studentTaskGaps.every(item => item.pass), JSON.stringify(studentTaskGaps));
          api.saveState({ grayscale: false });
        }
      }

      const approvedMatrixStates = matrixStates.filter(state => state.caseId !== "SSS-C1-CASE04");
      const case04MatrixStates = matrixStates.filter(state => state.caseId === "SSS-C1-CASE04");
      check("existing Cases 01–03 presentation matrix remains 24/24", approvedMatrixStates.length === 24 && approvedMatrixStates.every(state => state.pass), JSON.stringify(approvedMatrixStates.filter(state => !state.pass)));
      check("Case 04 presentation matrix passes 8/8", case04MatrixStates.length === 8 && case04MatrixStates.every(state => state.pass), JSON.stringify(case04MatrixStates.filter(state => !state.pass)));
      check("all 32 case-role-presentation matrix states pass", matrixStates.length === 32 && matrixStates.every(state => state.pass), JSON.stringify(matrixStates.filter(state => !state.pass)));
      const protectedGeometrySignatures = Object.fromEntries(Object.entries(protectedPresentation).map(([caseId, value]) => [caseId, JSON.stringify({ title: { columns: value.title.columns, gap: value.title.gap, border: value.title.border, rail: value.title.rail, heroSize: value.title.heroSize, heroLine: value.title.heroLine, subtitleSize: value.title.subtitleSize, insignia: value.title.insignia }, continuation: { columns: value.continuation.columns, gap: value.continuation.gap, border: value.continuation.border, titleSize: value.continuation.titleSize, insignia: value.continuation.insignia } })]));
      check("Cases 01–04 share protected title and continuation geometry", new Set(Object.values(protectedGeometrySignatures)).size === 1, JSON.stringify(protectedPresentation));

      for (const item of canonicalCases) {
        await api.selectCase(item.id);
        api = win.__curriculumEditor;
        workspace = api.getWorkspace();
        const marker = caseMarkers[item.id];
        check(`${item.id} response autosave is isolated across case switches`, workspace.querySelector(`[data-persist-id="${marker.response}"]`)?.textContent === marker.responseText);
        check(`${item.id} instructional autosave is isolated across case switches`, workspace.querySelector(`[data-persist-id="${marker.editable}"]`)?.textContent === marker.editText);
        check(`${item.id} role state is isolated across case switches`, api.getState().role === "student");
        check(`${item.id} announcement identifies case version role and grayscale`, doc.querySelector("#loadStatus").textContent.includes(api.getPackage().title) && doc.querySelector("#loadStatus").textContent.includes(`v${item.version}`) && doc.querySelector("#loadStatus").textContent.includes("Student Mission") && doc.querySelector("#loadStatus").textContent.includes("Grayscale"));
      }
      const documentIds = Array.from(doc.querySelectorAll("[id]")).map(node => node.id);
      check("case cycling leaves no duplicate IDs in the application document", documentIds.length === new Set(documentIds).size);
      check("case cycling leaves one current worksheet main and no stale light-DOM worksheet", doc.querySelector("#worksheetHost").shadowRoot.querySelectorAll("main#worksheetWorkspace").length === 1 && !doc.querySelector("main#worksheetWorkspace"));
      check("browser run reports zero JavaScript errors", javascriptErrors.length === 0, javascriptErrors.join("\n"));

      const passed = assertions.filter(item => item.pass).length;
      const payload = { validator: "curriculum-editor-browser-v2", status: passed === assertions.length ? "PASS" : "FAIL", passed, total: assertions.length, assertions };
      await report(payload);
    } catch (error) {
      check("browser harness completed without exception", false, error.stack || error);
      const passed = assertions.filter(item => item.pass).length;
      await report({ validator: "curriculum-editor-browser-v2", status: "FAIL", passed, total: assertions.length, assertions });
    }
  </script>
</body>
</html>
