name: SSS Final Remediation

on:
  workflow_dispatch:
  push:
    branches:
      - remediate/sss-final-system
    paths:
      - 'shared/remediation/**'
      - 'shared/validation/validate_final_quality_contract*.py'
      - 'shared/validation/validate_final_accessibility_contract*.py'
      - 'shared/validation/validate_sss_final_corrective_candidates.py'
      - 'shared/validation/validate_canonical_case_structure_corrective.py'
      - 'shared/validation/run_curriculum_browser_harness.py'
      - 'apps/curriculum-editor/tests/test_corrective_release_lifecycle.py'
      - 'shared/implementation/case-registry.v2.json'
      - 'shared/implementation/SSS_HHH_*_CONTRACT_v1.0.md'
      - '.github/workflows/sss-final-remediation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'sss/campaign-1/**'
      - 'sss/campaign-2/**'
      - 'shared/remediation/**'
      - 'shared/validation/validate_final_quality_contract*.py'
      - 'shared/validation/validate_final_accessibility_contract*.py'
      - 'shared/validation/validate_sss_final_corrective_candidates.py'
      - 'shared/validation/validate_canonical_case_structure_corrective.py'
      - 'shared/validation/run_curriculum_browser_harness.py'
      - 'apps/curriculum-editor/tests/test_corrective_release_lifecycle.py'
      - 'shared/implementation/case-registry.v2.json'
      - 'shared/implementation/SSS_HHH_*_CONTRACT_v1.0.md'
      - '.github/workflows/sss-final-remediation.yml'

permissions:
  contents: write

concurrency:
  group: sss-final-remediation-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  remediate:
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[auto-remediation]'))
    runs-on: ubuntu-latest
    steps:
      - name: Verify protected branch scope
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "remediate/sss-final-system"
      - uses: actions/checkout@v4
        with:
          ref: remediate/sss-final-system
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Apply deterministic source remediations
        run: python shared/remediation/apply_sss_final_remediation_v5.py --apply
      - name: Classify final response controls in layout contracts
        run: python shared/remediation/classify_sss_final_response_controls.py
      - name: Transition remediated packages to corrective DRAFT candidates
        run: python shared/remediation/transition_sss_final_corrective_candidates.py
      - run: git diff --check
      - name: Record corrective-candidate source and layout transition
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "sss-remediation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sss/campaign-1 sss/campaign-2 shared/implementation/case-registry.v2.json
          git commit -m "[auto-remediation] Reconcile final SSS response layout contracts"
          git push origin HEAD:remediate/sss-final-system
      - name: Candidate diagnostics
        continue-on-error: true
        run: |
          python shared/validation/validate_final_quality_contract_v3.py
          python shared/validation/validate_final_accessibility_contract_v2.py
          python shared/validation/validate_sss_final_corrective_candidates.py

  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 jsonschema
      - name: Verify source, layout, and lifecycle remediation are idempotent
        run: |
          python shared/remediation/apply_sss_final_remediation_v5.py --apply
          python shared/remediation/classify_sss_final_response_controls.py
          python shared/remediation/transition_sss_final_corrective_candidates.py
          git diff --check
          git diff --exit-code
      - name: Final cross-edition quality contract
        run: python shared/validation/validate_final_quality_contract_v3.py
      - name: Final audit-specific accessibility contract
        run: python shared/validation/validate_final_accessibility_contract_v2.py
      - name: Corrective-release lifecycle unit tests
        run: python apps/curriculum-editor/tests/test_corrective_release_lifecycle.py
      - name: Final corrective-candidate lifecycle contract
        run: python shared/validation/validate_sss_final_corrective_candidates.py
      - name: Generic release-integrity validator
        run: python shared/validation/validate_release_integrity.py
      - name: Corrective-aware canonical package and layout validators
        run: |
          python shared/validation/validate_canonical_case_structure_corrective.py
          python shared/validation/validate_layout_overrides.py
      - name: Legacy static suite diagnostic
        continue-on-error: true
        timeout-minutes: 15
        run: python apps/curriculum-editor/tests/validate_static.py

  browser-pr:
    if: github.event_name == 'pull_request'
    needs: validate-pr
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Existing curriculum-editor browser harness
        timeout-minutes: 8
        run: python shared/validation/run_curriculum_browser_harness.py
