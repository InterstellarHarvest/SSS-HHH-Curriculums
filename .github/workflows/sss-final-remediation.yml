name: SSS Final Remediation

on:
  workflow_dispatch:
  push:
    branches:
      - remediate/sss-final-system
    paths:
      - 'shared/remediation/**'
      - 'shared/validation/validate_final_quality_contract*.py'
      - 'shared/validation/validate_final_accessibility_contract*.py'
      - 'shared/validation/validate_sss_final_corrective_candidates.py'
      - 'shared/implementation/case-registry.v2.json'
      - 'shared/implementation/SSS_HHH_*_CONTRACT_v1.0.md'
      - '.github/workflows/sss-final-remediation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'sss/campaign-1/**'
      - 'sss/campaign-2/**'
      - 'shared/remediation/**'
      - 'shared/validation/validate_final_quality_contract*.py'
      - 'shared/validation/validate_final_accessibility_contract*.py'
      - 'shared/validation/validate_sss_final_corrective_candidates.py'
      - 'shared/implementation/case-registry.v2.json'
      - 'shared/implementation/SSS_HHH_*_CONTRACT_v1.0.md'
      - '.github/workflows/sss-final-remediation.yml'

permissions:
  contents: write

concurrency:
  group: sss-final-remediation-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  remediate:
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[auto-remediation]'))
    runs-on: ubuntu-latest
    steps:
      - name: Verify protected branch scope
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "remediate/sss-final-system"

      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: remediate/sss-final-system
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install remediation dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Apply deterministic source remediations
        run: python shared/remediation/apply_sss_final_remediation_v5.py --apply

      - name: Transition remediated packages to corrective DRAFT candidates
        run: python shared/remediation/transition_sss_final_corrective_candidates.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Record corrective-candidate transition
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "sss-remediation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sss/campaign-1 sss/campaign-2 shared/implementation/case-registry.v2.json
          git commit -m "[auto-remediation] Open final SSS corrective candidates"
          git push origin HEAD:remediate/sss-final-system
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run final quality contract diagnostic
        continue-on-error: true
        run: python shared/validation/validate_final_quality_contract_v3.py | tee /tmp/final-quality-contract.txt

      - name: Run audit-specific accessibility diagnostic
        continue-on-error: true
        run: python shared/validation/validate_final_accessibility_contract_v2.py | tee /tmp/final-accessibility-contract.txt

      - name: Run candidate lifecycle diagnostic
        continue-on-error: true
        run: python shared/validation/validate_sss_final_corrective_candidates.py | tee /tmp/final-candidate-lifecycle.txt

      - name: Preserve diagnostic summary
        if: always()
        shell: bash
        run: |
          for file in /tmp/final-quality-contract.txt /tmp/final-accessibility-contract.txt /tmp/final-candidate-lifecycle.txt; do
            if test -f "$file"; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done

  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 jsonschema

      - name: Verify remediation and lifecycle transition are idempotent
        run: |
          python shared/remediation/apply_sss_final_remediation_v5.py --apply
          python shared/remediation/transition_sss_final_corrective_candidates.py
          git diff --check
          git diff --exit-code

      - name: Final cross-edition quality contract
        run: python shared/validation/validate_final_quality_contract_v3.py

      - name: Final audit-specific accessibility contract
        run: python shared/validation/validate_final_accessibility_contract_v2.py

      - name: Final corrective-candidate lifecycle contract
        run: python shared/validation/validate_sss_final_corrective_candidates.py

      - name: Generic release-integrity validator
        run: python shared/validation/validate_release_integrity.py

      - name: Canonical package and layout validators
        run: |
          python shared/validation/validate_canonical_case_structure.py
          python shared/validation/validate_layout_overrides.py

      - name: Legacy static suite diagnostic
        id: legacy_static
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          python apps/curriculum-editor/tests/validate_static.py 2>&1 | tee /tmp/legacy-static.txt

      - name: Summarize legacy static diagnostic
        if: always()
        shell: bash
        run: |
          echo '## Legacy static suite diagnostic' >> "$GITHUB_STEP_SUMMARY"
          if test -f /tmp/legacy-static.txt; then
            tail -n 250 /tmp/legacy-static.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Static diagnostic did not produce output.' >> "$GITHUB_STEP_SUMMARY"
          fi
